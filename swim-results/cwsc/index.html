<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>No longer available</title>
<style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:40px 16px;text-align:center;color:#13293d;background:#fff}</style></head>
<body><h1>This app is no longer available</h1><p>You can delete this icon from your home screen.</p>
<script>
// clear anything the old app kept on this phone
try{localStorage.clear();sessionStorage.clear();}catch(e){}
(window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));}):Promise.resolve())
.then(function(){return navigator.serviceWorker?navigator.serviceWorker.getRegistrations():[];})
.then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}).catch(function(){});
</script></body></html>
